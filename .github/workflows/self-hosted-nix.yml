# Adapted from storytold/craft-common-actions at fd14193f062cd71f9de9426bd450aa0adad670f0.
name: "Nix"

on:
  workflow_call:
    inputs:
      extra-args:
        description: "Extra arguments to pass to nix flake check (shell-style quoting, no shell expansion)"
        type: string
        required: false
        default: "--no-build --all-systems"

permissions:
  contents: read

jobs:
  eval:
    if: ${{ github.repository_owner == 'mamankub' && github.actor == 'mamankub' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    name: eval
    runs-on: ["self-hosted", "Linux", "X64", "asd-ci", "ubuntu-24.04"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Check flake evaluation
        shell: bash
        env:
          NIX_EXTRA_ARGS: ${{ inputs.extra-args }}
        run: |
          if [ -f flake.nix ]; then
            python3 - <<'PY'
          import os
          import shlex

          os.execvp("nix", ["nix", "flake", "check", *shlex.split(os.environ["NIX_EXTRA_ARGS"])])
          PY
          else
            echo "No flake.nix present in this repository; skipping check."
          fi
