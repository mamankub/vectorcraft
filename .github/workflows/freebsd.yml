# FreeBSD build and package check in a QEMU VM.
name: FreeBSD

# The VM build is slow, so it runs nightly on main and on pushes to `release`, not on every pull
# request: a drifted dependency still shows up within a day, and always before a release ships.
# PRs that change the FreeBSD workflow or packaging itself still run it.
on:
  push:
    branches: [release]
  pull_request:
    paths:
      - .github/workflows/freebsd.yml
      - packaging/freebsd/**
      - packaging/env.sh
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freebsd:
    if: ${{ false && github.repository_owner == 'mamankub' }} # Owner paused non-Linux/Windows-x64 coverage (2026-11-10).
    uses: ./.github/workflows/self-hosted-freebsd.yml
    with:
      require-craft-fonts: true
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      run-package-check: true
